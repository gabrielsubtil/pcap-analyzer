name: pcap-doctor

services:
  pcap-doctor-web:
    build:
      context: ../..
      dockerfile: deploy/pcap-doctor/Dockerfile
    image: pcap-doctor-web:homologation
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - proxy
      - pcap_doctor_jobs

networks:
  proxy:
    external: true
  pcap_doctor_jobs:
    internal: true
