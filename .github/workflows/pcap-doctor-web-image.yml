name: PCAP Doctor Web image

on:
  push:
    branches:
      - feat/pcap-doctor-homologation
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RUST_TOOLCHAIN: 1.98.0

permissions:
  contents: read

jobs:
  test:
    name: Rust format and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup component add rustfmt --toolchain "${RUST_TOOLCHAIN}"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting
        run: cargo +"${RUST_TOOLCHAIN}" fmt --manifest-path web/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo +"${RUST_TOOLCHAIN}" test --manifest-path web/Cargo.toml --locked

  publish:
    name: Build and publish linux/arm64 image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image reference
        id: image
        shell: bash
        run: |
          image="${IMAGE_NAME,,}:sha-${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Immutable tag: $image"

      - name: Build and push linux/arm64 image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/pcap-doctor/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_started_at }}

      - name: Verify published digest and platform
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          case "$DIGEST" in sha256:*) ;; *) echo "Unexpected digest: $DIGEST" >&2; exit 1 ;; esac
          reference="${IMAGE%@*}@${DIGEST}"
          manifest_json="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$reference")"
          printf '%s\n' "$manifest_json" | tee /tmp/pcap-doctor-image-manifest.json >/dev/null
          verified_digest="$(jq -er '.digest' <<<"$manifest_json")"
          test "$verified_digest" = "$DIGEST"

          platform_json="$(docker buildx imagetools inspect --format '{{json .Image}}' "$reference")"
          printf '%s\n' "$platform_json" | tee /tmp/pcap-doctor-image-platform.json >/dev/null
          jq -e '(.os == "linux") and (.architecture == "arm64")' \
            /tmp/pcap-doctor-image-platform.json >/dev/null

          {
            echo "### Published image"
            echo
            echo "Image: $reference"
            echo
            echo "Verified digest: $verified_digest"
            echo 'Platform verified: linux/arm64 (os=linux, architecture=arm64)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate container provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
